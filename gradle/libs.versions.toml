[versions]
agp = "8.5.2"
kotlin = "2.0.0"
ksp = "2.0.0-1.0.23"
hilt = "2.51.1"
compose-bom = "2024.06.00"
compose-compiler = "1.5.14"
room = "2.6.1"
lifecycle = "2.8.3"
navigation = "2.7.7"
workmanager = "2.9.0"
datastore = "1.1.1"
kotlinx-serialization = "1.7.1"
kotlinx-coroutines = "1.8.1"
core-ktx = "1.13.1"
activity-compose = "1.9.0"
biometric = "1.1.0"

[libraries]
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.0.1" }
android-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
android-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
